name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20.19.0"
          - "22"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Some hosted-toolcache Node builds are group/world-writable. Keep the
      # production installer fail-closed and run CI through an owner-controlled
      # copy instead of weakening its runtime validation.
      - name: Prepare owner-controlled Node.js runtime
        shell: bash
        run: |
          runtime_dir="$(mktemp -d "${RUNNER_TEMP}/tabgrant-node-runtime.XXXXXX")"
          chmod 0700 "$runtime_dir"
          source_runtime="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          install -m 0755 "$source_runtime" "$runtime_dir/node"
          "$runtime_dir/node" --version
          echo "$runtime_dir" >> "$GITHUB_PATH"
          echo "TABGRANT_CI_NODE_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Verify owner-controlled Node.js runtime
        shell: bash
        run: |
          resolved_node="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          test "$resolved_node" = "${TABGRANT_CI_NODE_RUNTIME_DIR}/node"
          test "$(stat -c '%a' "$TABGRANT_CI_NODE_RUNTIME_DIR")" = "700"
          test "$(stat -c '%u' "$TABGRANT_CI_NODE_RUNTIME_DIR")" = "$(id -u)"
          test "$(stat -c '%a' "$resolved_node")" = "755"
          test "$(stat -c '%u' "$resolved_node")" = "$(id -u)"
          test -f "$resolved_node"
          test ! -L "$resolved_node"
          test -x "$resolved_node"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, types, and tests
        run: pnpm check

      - name: Build workspace
        run: pnpm build

      - name: Audit dependency advisories
        if: matrix.node == '22'
        run: pnpm audit --audit-level high

      - name: Smoke-test packed CLI
        run: pnpm pack:smoke

  macos-smoke:
    name: macOS Node 22 build and package smoke
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Smoke-test packed CLI
        run: pnpm pack:smoke

  chrome-e2e:
    name: Chrome for Testing end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      # Match the verify job's safe runtime boundary before the production
      # installer is exercised by the browser E2E harness.
      - name: Prepare owner-controlled Node.js runtime
        shell: bash
        run: |
          runtime_dir="$(mktemp -d "${RUNNER_TEMP}/tabgrant-node-runtime.XXXXXX")"
          chmod 0700 "$runtime_dir"
          source_runtime="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          install -m 0755 "$source_runtime" "$runtime_dir/node"
          "$runtime_dir/node" --version
          echo "$runtime_dir" >> "$GITHUB_PATH"
          echo "TABGRANT_CI_NODE_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Verify owner-controlled Node.js runtime
        shell: bash
        run: |
          resolved_node="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          test "$resolved_node" = "${TABGRANT_CI_NODE_RUNTIME_DIR}/node"
          test "$(stat -c '%a' "$TABGRANT_CI_NODE_RUNTIME_DIR")" = "700"
          test "$(stat -c '%u' "$TABGRANT_CI_NODE_RUNTIME_DIR")" = "$(id -u)"
          test "$(stat -c '%a' "$resolved_node")" = "755"
          test "$(stat -c '%u' "$resolved_node")" = "$(id -u)"
          test -f "$resolved_node"
          test ! -L "$resolved_node"
          test -x "$resolved_node"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Testing
        run: pnpm e2e:chrome:install

      - name: Verify isolated browser chain (disposable profile; sandbox disabled)
        run: pnpm e2e:chrome:ci:linux-no-sandbox
